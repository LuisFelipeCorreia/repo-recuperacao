name: Python CI com Quality Gate

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Executar Testes e Validar Cobertura (Quality Gate)
        # O pipeline vai falhar se a cobertura for menor que 80%
        run: pytest --cov=app --cov-fail-under=80 test_app.py